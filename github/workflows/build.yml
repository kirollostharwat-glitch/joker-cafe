name: Build Joker Cafe
on: [workflow_dispatch]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract ZIP
        shell: pwsh
        run: |
          Expand-Archive -Path "joker-cafe-windows-src.zip" -DestinationPath "extracted" -Force
          $pubspec = Get-ChildItem -Path "extracted" -Filter "pubspec.yaml" -Recurse | Select-Object -First 1
          echo "PROJ_DIR=$($pubspec.DirectoryName)" >> $env:GITHUB_ENV
      - uses: subosito/flutter-action@v2
      - name: Build Windows EXE
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: JokerCafe-Windows-EXE
          path: ${{ env.PROJ_DIR }}/build/windows/x64/runner/Release/

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract ZIP
        run: |
          unzip -q joker-cafe-windows-src.zip -d extracted
          PROJ_DIR=$(dirname $(find extracted -name "pubspec.yaml" | head -n 1))
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
      - name: Build Android APK
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: JokerCafe-Android-APK
          path: ${{ env.PROJ_DIR }}/build/app/outputs/flutter-apk/app-release.apk
