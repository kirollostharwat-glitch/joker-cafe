name: Build Joker Cafe
on: [workflow_dispatch]

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Setup, Rename, Icons & Build Windows
        shell: powershell
        run: |
          Copy-Item "lib/main.dart" -Destination "main_backup.dart"
          flutter create . --platforms=windows,android --project-name=joker_cafe_pos
          Move-Item -Path "main_backup.dart" -Destination "lib/main.dart" -Force
          if (Test-Path "test/widget_test.dart") { Remove-Item "test/widget_test.dart" -Force }
          if (Test-Path "android/app/build.gradle.kts") {
            (Get-Content "android/app/build.gradle.kts" -Raw) -replace 'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 24' -replace 'com\.example\.joker_cafe_pos', 'com.cafepos.cafe_pos' | Set-Content "android/app/build.gradle.kts" -NoNewline
          } elseif (Test-Path "android/app/build.gradle") {
            (Get-Content "android/app/build.gradle" -Raw) -replace 'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 24' -replace 'com\.example\.joker_cafe_pos', 'com.cafepos.cafe_pos' | Set-Content "android/app/build.gradle" -NoNewline
          }
          $oldKotlin = "android/app/src/main/kotlin/com/example/joker_cafe_pos"
          $newKotlin = "android/app/src/main/kotlin/com/cafepos/cafe_pos"
          if (Test-Path $oldKotlin) {
            New-Item -ItemType Directory -Force -Path $newKotlin | Out-Null
            Move-Item -Path "$oldKotlin\MainActivity.kt" -Destination "$newKotlin\MainActivity.kt" -Force
            (Get-Content "$newKotlin\MainActivity.kt" -Raw) -replace 'com\.example\.joker_cafe_pos', 'com.cafepos.cafe_pos' | Set-Content "$newKotlin\MainActivity.kt" -NoNewline
            Remove-Item $oldKotlin -Recurse -Force
          }
          flutter pub get
          dart run rename_app:main all="Joker Cafe"
          if (Test-Path "joker.png") { dart run flutter_launcher_icons }
          if (Test-Path "windows/CMakeLists.txt") {
            (Get-Content "windows/CMakeLists.txt" -Raw) -replace '/W4 /WX /wd4100', '/W4 /WX /wd4100 /wd4238' | Set-Content "windows/CMakeLists.txt" -NoNewline
          }
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: JokerCafe-Windows-EXE
          path: build/windows/x64/runner/Release/

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Setup, Rename, Icons & Build APK
        run: |
          cp lib/main.dart main_backup.dart
          flutter create . --platforms=android,windows --project-name=joker_cafe_pos
          mv -f main_backup.dart lib/main.dart
          rm -f test/widget_test.dart
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk *= *flutter\.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
            sed -i 's/com\.example\.joker_cafe_pos/com.cafepos.cafe_pos/g' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion *= *flutter\.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
            sed -i 's/com\.example\.joker_cafe_pos/com.cafepos.cafe_pos/g' android/app/build.gradle
          fi
          OLD_KOTLIN="android/app/src/main/kotlin/com/example/joker_cafe_pos"
          NEW_KOTLIN="android/app/src/main/kotlin/com/cafepos/cafe_pos"
          if [ -d "$OLD_KOTLIN" ]; then
            mkdir -p "$NEW_KOTLIN"
            mv -f "$OLD_KOTLIN/MainActivity.kt" "$NEW_KOTLIN/MainActivity.kt"
            sed -i 's/com\.example\.joker_cafe_pos/com.cafepos.cafe_pos/g' "$NEW_KOTLIN/MainActivity.kt"
            rm -rf "$OLD_KOTLIN"
          fi
          flutter pub get
          dart run rename_app:main all="Joker Cafe"
          if [ -f "joker.png" ]; then dart run flutter_launcher_icons; fi
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: JokerCafe-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
