name: Build Joker Cafe
on: [workflow_dispatch]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      - run: |
          flutter create . --platforms=windows
          flutter pub get
          - name: Change App Name to Joker Cafe & Set Joker Icon
            run: |
          dart run rename_app:main all="Joker Cafe"
          dart run flutter_launcher_icons
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: JokerCafe-Windows-EXE
          path: build/windows/x64/runner/Release/

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
      - run: |
          flutter create . --platforms=android
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><application/' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: JokerCafe-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
