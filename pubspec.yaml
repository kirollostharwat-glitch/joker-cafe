name: joker_cafe_pos
description: Joker Cafe - نظام إدارة كافيه وبلياردو وبينج بونج
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  connectivity_plus: ^6.0.5
  provider: ^6.1.2
  uuid: ^4.5.1
  intl: any
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  pdf: ^3.11.1
  printing: ^5.13.3
  excel: ^4.0.6
  path_provider: ^2.1.4
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: ^0.14.1
  rename_app: ^1.6.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "joker.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "joker.png"
    icon_size: 256

flutter:
  uses-material-design: true
