name: joker_cafe_pos
description: Joker Cafe - نظام إدارة كافيه وبلياردو وبينج بونج (ويندوز وأندرويد)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase & Offline Sync
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4

  # Network & Native OS Notifications
  connectivity_plus: ^6.0.5
  flutter_local_notifications: ^17.2.3

  # State Management & Utilities
  provider: ^6.1.2
  uuid: ^4.5.1
  intl: ^0.19.0
  shared_preferences: ^2.3.2

  # Fonts & Styling
  google_fonts: ^6.2.1

  # PDF, Printing & Excel Export
  pdf: ^3.11.1
  printing: ^5.13.3
  excel: ^4.0.6
  path_provider: ^2.1.4
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  msix: ^3.16.8
  flutter_launcher_icons: ^0.14.1
  rename_app: ^1.6.1

# إعدادات توليد أيقونة الجوكر للأندرويد والويندوز أوتوماتيك
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/joker.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/joker.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/joker.png
